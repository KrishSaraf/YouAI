name: YouAI
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.55.3
options:
  bundleIdPrefix: com.leanlah
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  YouAI:
    type: application
    platform: iOS
    sources:
      - path: YouAI
        excludes:
          - ExerciseDB/images/**
      - path: YouAI/ExerciseDB/images
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leanlah.app
        INFOPLIST_FILE: YouAI/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: YouAI/YouAI.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        com.apple.developer.healthkit: true
    dependencies:
      - sdk: HealthKit.framework
      - sdk: Speech.framework
      - sdk: AuthenticationServices.framework
      - package: Supabase

schemes:
  YouAI:
    build:
      targets:
        YouAI: all
    run:
      config: Debug
